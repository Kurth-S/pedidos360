# Clúster Apache Kafka de Pedidos360: 1 Zookeeper + 3 brokers (factor de replicación 3, min.insync.replicas 2).
#
#   docker compose -f docker-compose.kafka.yml up -d
#   docker compose -f docker-compose.kafka.yml ps
#
# Puertos para los microservicios (en el mismo host): localhost:9092, localhost:9093 y localhost:9094.
# Si los microservicios corren en OTRA máquina, define KAFKA_EXTERNAL_HOST con la IP/DNS de esta (ej. la IP privada de la EC2).
# Los brokers tienen auto-creación de tópicos DESACTIVADA: los tópicos los crea ms-kafka-admin (o Kafka UI) con su configuración.
# Memoria aprox.: 1,5 GB entre los 4 contenedores. En una EC2 t2.micro (1 GB) NO cabe: usa t3.medium o superior.

name: pedidos360-kafka

x-kafka-comun: &kafka-comun
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  depends_on:
    - zookeeper
  networks:
    - pedidos360-net

x-kafka-entorno: &kafka-entorno
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    hostname: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - pedidos360-net

  kafka1:
    <<: *kafka-comun
    container_name: kafka1
    hostname: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-entorno
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-comun
    container_name: kafka2
    hostname: kafka2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-entorno
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-comun
    container_name: kafka3
    hostname: kafka3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-entorno
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
    volumes:
      - kafka3-data:/var/lib/kafka/data

networks:
  pedidos360-net:
    name: pedidos360-net

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
