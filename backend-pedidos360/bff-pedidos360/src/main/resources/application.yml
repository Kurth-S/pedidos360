server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bff-pedidos360

pedidos360:
  security:
    # Valores del IDaaS (copiar desde un token decodificado en https://jwt.ms)
    issuer: ${JWT_ISSUER:https://REEMPLAZAR-TENANT-ID.ciamlogin.com/REEMPLAZAR-TENANT-ID/v2.0}
    jwk-set-uri: ${JWT_JWKS_URI:https://REEMPLAZAR-SUBDOMINIO.ciamlogin.com/REEMPLAZAR-TENANT-ID/discovery/v2.0/keys}
    audiences: ${JWT_AUDIENCE:REEMPLAZAR-CLIENT-ID-API}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    roles-claim: ${JWT_ROLES_CLAIM:roles}
  clients:
    # URLs internas de los microservicios (en EC2: localhost)
    productos-url: ${PRODUCTOS_URL:http://localhost:8081}
    pedidos-url: ${PEDIDOS_URL:http://localhost:8082}
