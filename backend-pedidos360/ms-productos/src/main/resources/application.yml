server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-productos
  # Propiedades de conexión a la base de datos cloud (Amazon RDS MySQL)
  datasource:
    url: ${DB_URL:jdbc:mysql://REEMPLAZAR-ENDPOINT-RDS:3306/pedidos360_productos?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:REEMPLAZAR-PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
  # Conexión al broker RabbitMQ
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    connection-timeout: 3s
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5
        default-requeue-rejected: false
  # Brokers Kafka (mismo valor que pedidos360.kafka.bootstrap-servers)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

pedidos360:
  security:
    # Valores del IDaaS (copiar desde un token decodificado en https://jwt.ms)
    issuer: ${JWT_ISSUER:https://REEMPLAZAR-TENANT-ID.ciamlogin.com/REEMPLAZAR-TENANT-ID/v2.0}
    jwk-set-uri: ${JWT_JWKS_URI:https://REEMPLAZAR-SUBDOMINIO.ciamlogin.com/REEMPLAZAR-TENANT-ID/discovery/v2.0/keys}
    audiences: ${JWT_AUDIENCE:REEMPLAZAR-CLIENT-ID-API}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    roles-claim: ${JWT_ROLES_CLAIM:roles}
  inventario:
    # Si el stock de un producto pedido es <= a este valor, se publica un evento de stock bajo
    umbral-stock-bajo: ${STOCK_BAJO_UMBRAL:5}
  # Nombres de exchanges, colas y routing keys: ÚNICO lugar donde se escriben.
  rabbit:
    exchange: pedidos360.eventos
    dead-letter-exchange: pedidos360.eventos.dlx
    routing-keys:
      pedido-creado: pedido.creado
      stock-bajo: inventario.stock-bajo
    queues:
      inventario:
        name: inventario.pedido-creado.q
        dlq: inventario.pedido-creado.dlq

  # Cliente Kafka: productor (tópico de inventario) y consumidor (tópico de pedidos). KafkaSettings es la única fuente.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    topics:
      pedidos-eventos: pedidos360.pedidos.eventos
      inventario-eventos: pedidos360.inventario.eventos
      dlt-suffix: .DLT
    groups:
      inventario-demanda: productos.inventario-demanda   # este servicio lee TODOS los pedidos con su propio group
    producer:
      acks: all
      idempotence: true
      retries: 5
      max-block-ms: 3000
      request-timeout-ms: 5000
      delivery-timeout-ms: 15000
      linger-ms: 5
      compression: lz4
    consumer:
      auto-offset-reset: earliest   # un grupo nuevo empieza desde el primer mensaje retenido
      max-poll-records: 50
      max-poll-interval-ms: 300000
      session-timeout-ms: 30000
      heartbeat-interval-ms: 10000
      concurrency: 3                # 3 hilos = 1 por partición del tópico de pedidos
    retry:
      max-attempts: 3               # reintentos antes de enviar a la DLT
      initial-interval-ms: 500
      multiplier: 2.0
      max-interval-ms: 5000
